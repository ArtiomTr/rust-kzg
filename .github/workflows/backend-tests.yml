name: tests
on: [push, pull_request, workflow_dispatch]
env:
  C_KZG_4844_GIT_HASH: '00ae727c21a346ba0bd027eca6e378da0def988f'

jobs:
  kzg_ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      # Check kzg and kzg-bench with all feature combinations
      - name: "kzg lint (all features)"
        run: make lint-kzg

      # Check kzg-bench with all features
      - name: "kzg-bench lint"
        run: make lint-kzg-bench

      # Check formatting
      - name: "format check"
        run: make format-check

  backend_ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        backend:
          [blst, zkcrypto, arkworks5, arkworks4, arkworks3, constantine, mcl]
        include:
          # Setup exec_once_per_backend flag
          - os: ubuntu-latest
            exec_once_per_backend: true
          # Select backends which support wasm & which support ckzg drop-in
          - backend: blst
            support_wasm: true
            support_ckzg: true
          - backend: zkcrypto
            support_wasm: true
            support_ckzg: true
          - backend: arkworks4
            support_wasm: true
            support_ckzg: true
          - backend: arkworks3
            support_wasm: true
            support_ckzg: true
          - backend: arkworks5
            support_wasm: true
            support_ckzg: true
          - backend: constantine
            # FIXME: Check for wasm support
            support_wasm: false
            support_ckzg: true
          - backend: mcl
            support_wasm: false
            support_ckzg: true
        exclude:
          - os: windows-latest
            backend: mcl
            # FIXME: enable macos, when fixes are merged into constantine-public-sys branch
          - os: macos-latest
            backend: constantine

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "11"

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.0.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          parent-nim-install-directory: ${{ runner.temp }}

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install py_ecc
          pip install PyYAML
          pip install build

      - uses: actions/setup-go@v2
        with:
          go-version: ^1.19

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x.x"

      - name: "install clang-format"
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo DEBIAN_FRONTEND='noninteractive' apt-get install \
            --no-install-recommends -yq \
            clang-format-20
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-20 200
          sudo update-alternatives --set clang-format /usr/bin/clang-format-20

      - name: "constantine - install deps"
        if: matrix.backend == 'constantine' && matrix.os == 'ubuntu-latest'
        run: |
          sudo DEBIAN_FRONTEND='noninteractive' apt-get install \
            --no-install-recommends -yq \
            libgmp-dev \
            llvm

      # Check backend clippy and format
      - name: "${{ matrix.backend }} lint"
        if: matrix.exec_once_per_backend
        run: make lint-${{ matrix.backend }}

      # Check wasm32 target for backend
      - name: "[wasm32] ${{ matrix.backend }}"
        if: matrix.exec_once_per_backend && matrix.support_wasm
        run: make build-wasm-${{ matrix.backend }}

      # Run backend tests
      - name: "${{ matrix.backend }} tests"
        run: make test-${{ matrix.backend }}

      # Run parallel backend tests
      - name: "${{ matrix.backend }} tests (parallel)"
        run: make test-parallel-${{ matrix.backend }}

      # Run c-kzg-4844 integration tests
      - name: "${{ matrix.backend }} tests (c-kzg-4844)"
        if: matrix.exec_once_per_backend && matrix.support_ckzg
        run: make test-c-kzg-${{ matrix.backend }}

      # Run c-kzg-4844 parallel tests
      - name: "${{ matrix.backend }} tests (c-kzg-4844 parallel)"
        if: matrix.exec_once_per_backend && matrix.support_ckzg
        run: make test-c-kzg-parallel-${{ matrix.backend }}
