name: automatic release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  C_KZG_4844_GIT_HASH: '00ae727c21a346ba0bd027eca6e378da0def988f'

jobs:
  release-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [blst, zkcrypto, arkworks5, arkworks4, arkworks3, constantine]
        target: [windows, linux]
    env:
      matrix-name: "[${{ matrix.backend }}, ${{ matrix.target }}]"
      staging-dir: staging/${{ matrix.backend }}/${{ matrix.target }}
      archive-name: rust-kzg-${{ matrix.backend }}-${{ matrix.target }}.zip
    steps:
      - uses: actions/checkout@v2

      - if: matrix.backend == 'constantine'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.0.2'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          parent-nim-install-directory: ${{ runner.temp }}

      # Install constantine backend deps
      - name: "constantine - install deps"
        if: matrix.backend == 'constantine'
        run: |
          sudo DEBIAN_FRONTEND='noninteractive' apt-get install \
            --no-install-recommends -yq \
            libgmp-dev \
            llvm

      - if: matrix.target == 'windows'
        name: Install MinGW
        run: |
          sudo apt install -y mingw-w64

      - name: "${{ env.matrix-name }} Build and archive"
        run: make archive-${{ matrix.backend }}-${{ matrix.target }}

      - name: "${{ env.matrix-name }} Upload"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive-name }}
          path: ${{ env.staging-dir }}/${{ env.archive-name }}

  release-publish:
    runs-on: ubuntu-latest
    needs: release-build
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
    - uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest"
        prerelease: false
        title: "Automatic Release"
        files: |
          ./rust-kzg-*.zip/rust-kzg-*.zip
